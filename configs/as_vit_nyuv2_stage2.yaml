# Stage 2: Clean Production Retraining Configuration for AS-ViT
model:
  img_size: 224
  patch_size: 16
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  act_layer: "gelu"

training:
  epochs: 100
  batch_size: 16
  lr: 3.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  clip_grad: 5.0
  warmup_epochs: 5
  seed: 42

loss_weights:
  segmentation: 1.0
  depth: 1.0
  surface_normals: 1.0
